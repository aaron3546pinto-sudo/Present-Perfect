    <script>
        const gifts = [
            // Luxury Gifts

            // Chocolate Gifts
            { name: "Gourmet Belgian Chocolate Box", description: "A premium Belgian chocolate gift box.", image: "../static/images/chocolate1.jpg", price: 45, category: "chocolate", occasion: "birthday" },
            { name: "Chocolate-Covered Strawberries", description: "Delicious strawberries covered in smooth chocolate.", image: "../static/images/chocolate2.jpg", price: 25, category: "chocolate", occasion: "holidays" },
            { name: "Hot Chocolate Gift Set", description: "Everything you need for a luxurious hot chocolate experience.", image: "../static/images/chocolate3.jpg", price: 35, category: "chocolate", occasion: "graduation" },
            { name: "Artisanal Truffle Selection", description: "A selection of rich, artisanal chocolate truffles.", image: "../static/images/chocolate4.jpg", price: 40, category: "chocolate", occasion: "anniversary" },
            { name: "Luxury Chocolate Gift Basket", description: "A luxury basket filled with the finest chocolates.", image: "../static/images/chocolate5.jpg", price: 60, category: "chocolate", occasion: "wedding" },
            
            // Personalized Gifts
            { name: "Personalized Engraved Wooden Pen Set", description: "A beautiful wooden pen set with personalized engraving.", image: "../static/images/personalised1.jpg", price: 30, category: "personalized", occasion: "graduation" },
            { name: "Customizable Leather Wallet", description: "A sleek, customizable leather wallet.", image: "../static/images/personalised2.jpg", price: 45, category: "personalized", occasion: "birthday" },

        // Save items to localStorage for both categories and occasions
        function saveToLocalStorage() {
            const categories = ['luxury', 'handmade', 'chocolate', 'personalized', 'fashion'];
            const occasions = ['birthday', 'anniversary', 'wedding', 'holidays', 'graduation'];

            let storedGifts = {};

            gifts.forEach(gift => {
                // Store by category
                if (!storedGifts[gift.category]) {
                    storedGifts[gift.category] = [];
                }
                storedGifts[gift.category].push(gift);

                // Store by occasion
                if (!storedGifts[gift.occasion]) {
                    storedGifts[gift.occasion] = [];
                }
                storedGifts[gift.occasion].push(gift);
            });

            categories.forEach(category => {
                localStorage.setItem(category, JSON.stringify(storedGifts[category] || []));
            });

            occasions.forEach(occasion => {
                localStorage.setItem(occasion, JSON.stringify(storedGifts[occasion] || []));
            });
        }

        saveToLocalStorage();

        // Display all gifts on the homepage
        const giftListContainer = document.getElementById('giftList');
        gifts.forEach(gift => {
            const giftElement = document.createElement('div');
            giftElement.classList.add('col-md-4');
            giftElement.innerHTML = `
                <div class="gift-item p-3">
                    <img src="${gift.image}" alt="${gift.name}" class="img-fluid">
                    <h3>${gift.name}</h3>
                    <p>${gift.description}</p>
                    <p><strong>Price: $${gift.price.toFixed(2)}</strong></p>
                    <button class="btn btn-primary" onclick="addToCart({ name: '${gift.name}', price: ${gift.price}, quantity: 1 })">Add to Cart</button>
                </div>
            `;
            giftListContainer.appendChild(giftElement);
        });
         // Function to add item to cart with login check
    function addToCart(item) {
        // Check if user is logged in
        const isLoggedIn = localStorage.getItem('isLoggedIn'); // Assuming login status is stored in 'isLoggedIn' key
        if (!isLoggedIn || isLoggedIn === 'false') {
            // Alert the user to log in
            alert('Please log in to add items to your cart.');
            // Redirect to login page
            window.location.href = 'userlogin.html';
            return;
        }
    }
    // Function to filter gifts by category
    function filterGiftsByCategory(category) {
        const filteredGifts = gifts.filter(gift => gift.category === category);
        displayGifts(filteredGifts);
        // Redirect to categories1.html with the selected category as a query parameter
        window.location.href = `categories.html?category=${encodeURIComponent(category)}`;
    }
    // Function to filter gifts by occasion
    function filterGiftsByOccasion(occasion) {
        const filteredGifts = gifts.filter(gift => gift.occasion === occasion);
        displayGifts(filteredGifts);
        window.location.href = `categories.html?category=${encodeURIComponent(category)}`;
    }
    </script>
