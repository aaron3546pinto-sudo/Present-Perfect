<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PresentPerfect - My Cart</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/">PresentPerfect</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="home.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="userlogin.html">Login</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="#">My Cart</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="mycart.html">My Orders</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <h1 class="display-4 text-center my-5">My Cart</h1>
        <table class="table" id="cartTable">
            <thead>
                <tr>
                    <th>Gift</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Cart items will be dynamically populated here -->
            </tbody>
        </table>
        <!-- Updated button with a dark theme matching the site -->
        <button class="btn btn-dark text-light border-light" id="checkoutButton">Checkout</button>
        {% csrf_token %}
    </div>

    <script>
        // Load cart from localStorage and display in the table
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let cartTableBody = document.querySelector('#cartTable tbody');
            cartTableBody.innerHTML = '';  // Clear table first

            if (cart.length === 0) {
                cartTableBody.innerHTML = '<tr><td colspan="5" class="text-center">Your cart is empty!</td></tr>';
                document.getElementById('checkoutButton').disabled = true;
                return;
            }

            cart.forEach((item, index) => {
                // Ensure quantity is defined and valid
                if (!item.quantity || item.quantity <= 0) {
                    item.quantity = 1;  // Default quantity to 1 if it's undefined or invalid
                }

                let total = item.price * item.quantity;
                cartTableBody.innerHTML += `
                    <tr>
                        <td>${item.name || "Unnamed Item"}</td> <!-- Fix undefined name -->
                        <td>
                            <button class="btn btn-secondary btn-sm" onclick="changeQuantity(${index}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="btn btn-secondary btn-sm" onclick="changeQuantity(${index}, 1)">+</button>
                        </td>
                        <td>$${item.price.toFixed(2)}</td> <!-- Make sure price is fixed to two decimals -->
                        <td>$${total.toFixed(2)}</td> <!-- Fix NaN for totals -->
                        <td><button class="btn btn-danger" onclick="removeFromCart(${index})">Remove</button></td>
                    </tr>
                `;
            });

            document.getElementById('checkoutButton').disabled = false;
        }

        // Change the quantity of an item in the cart
        function changeQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart[index].quantity += change;  // Adjust the quantity

            // Check if the quantity is less than 1
            if (cart[index].quantity < 1) {
                removeFromCart(index); // Remove the item if quantity is less than 1
            } else {
                localStorage.setItem('cart', JSON.stringify(cart));
                loadCart();  // Reload cart after changing quantity
            }
        }

        // Remove item from cart
        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);  // Remove item by index
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();  // Reload cart after removing
        }

        document.getElementById('checkoutButton').addEventListener('click', function() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            fetch('/checkout/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'  // Include CSRF token for security
                },
                body: JSON.stringify(cart)
            })
            .then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.error(error));
        });

        // Initialize cart on page load
        document.addEventListener('DOMContentLoaded', loadCart);

        document.getElementById('checkoutButton').addEventListener('click', function() {
            window.location.href = '/checkout';  // Redirects to checkout page
        });
    </script>
</body>
</html>
