<!-- userlogin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PresentPerfect - User Login</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/styles.css"> <!-- custom styles -->
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/">PresentPerfect</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="#">Login</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <h1 class="display-4">User Login</h1>
        <!-- added onsubmit kunaal -->
        <form onsubmit="return onClickLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary" >Login</button>
        </form>
        <!-- Link to registration page -->
        <p class="mt-3">Don't have an account? <a href="userregistration.html">Register here</a></p>
    </div>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <!-- frontend part of validating login and sending req kunaal-->
    <script>
        // make a function to send req to backend on login
        function onClickLogin(event) {
            event.preventDefault();
            // get the username and password
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            // make a post request to the backend
            fetch('http://127.0.0.1:8000/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(response => response.json())
            .then(data => {
                // if the response is success, redirect to the home page
                if (data.status === 'success') {
                    window.location.href = 'home.html';
                    alert("Logged in.");
                } else {
                    // if the response is failure, show an alert
                    alert('Invalid username or password');
                }

            })
            .catch(error => {
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
