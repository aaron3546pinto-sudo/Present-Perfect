<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PresentPerfect - Category</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/styles1.css">
</head>
<body>
    <!-- Navbar similar to home page, without login -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/">PresentPerfect</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="home.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="mycart.html">My Cart</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="myorder.html">My Orders</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="categoriesDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Categories
                    </a>
                    <div class="dropdown-menu" aria-labelledby="categoriesDropdown">
                        <h6 class="dropdown-header">Types of Gifts</h6>
                        <a class="dropdown-item" href="categories1.html?category=luxury">Luxury Gifts</a>
                        <a class="dropdown-item" href="categories1.html?category=handmade">Handmade Gifts</a>
                        <a class="dropdown-item" href="categories1.html?category=chocolate">Chocolate Gifts</a>
                        <a class="dropdown-item" href="categories1.html?category=personalized">Personalized Gifts</a>
                        <a class="dropdown-item" href="categories1.html?category=fashion">Fashion Accessories</a>
                        <div class="dropdown-divider"></div>
                        <h6 class="dropdown-header">Occasions</h6>
                        <a class="dropdown-item" href="categories1.html?occasion=birthday">Birthdays</a>
                        <a class="dropdown-item" href="categories1.html?occasion=anniversary">Anniversaries</a>
                        <a class="dropdown-item" href="categories1.html?occasion=wedding">Weddings</a>
                        <a class="dropdown-item" href="categories1.html?occasion=holiday">Holidays</a>
                        <a class="dropdown-item" href="categories1.html?occasion=graduation">Graduations</a>
                    </div>
                </li>
            </ul>
            <div class="search-container ml-auto">
                <input type="text" id="searchInput" placeholder="Search for gifts..." onkeyup="searchGifts()">
                <button class="btn btn-outline-light ml-2" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="display-4 text-center my-5">Gifts in Category: <span id="categoryName"></span></h1>
        <div class="row" id="categoryGiftList">
            <!-- Items will be dynamically inserted here -->
        </div>
    </div>

    <script>
        // Add item to cart (without login check)
        function addToCart(item) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existingItem = cart.find(cartItem => cartItem.name === item.name);

            if (existingItem) {
                existingItem.quantity += item.quantity; // Increase quantity if already in cart
            } else {
                cart.push(item); // Add new item to cart
            }
            localStorage.setItem('cart', JSON.stringify(cart)); // Update cart in local storage
            alert(`${item.name} has been added to your cart!`);
        }

        // On page load
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const selectedCategory = urlParams.get('category');
            const selectedOccasion = urlParams.get('occasion');
            const categoryGiftList = document.getElementById('categoryGiftList');
            const categoryName = document.getElementById('categoryName');

            // Define gifts array
            const gifts = [
            { name: "Designer Leather Handbag", description: "A luxury leather handbag that adds elegance to any outfit.", image: "../static/images/luxury1.jpg", price: 150, category: "luxury", occasion: "anniversary" },
            { name: "High-End Watch", description: "A timeless high-end watch for sophisticated individuals.", image: "../static/images/luxury2.jpg", price: 250, category: "luxury", occasion: "birthday" },
            { name: "Premium Luxurious Perfume Set", description: "A premium collection of fine smelling perfumes.", image: "../static/images/luxury3.jpg", price: 120, category: "luxury", occasion: "holidays" },
            { name: "Crystal Wine Decanter Set", description: "A crystal decanter set for the perfect wine experience.", image: "../static/images/luxury4.jpg", price: 180, category: "luxury", occasion: "wedding" },
            { name: "Luxury Spa Set", description: "Pamper yourself with this luxurious spa set.", image: "../static/images/luxury5.jpg", price: 100, category: "luxury", occasion: "birthday" },
            { name: "Handcrafted Wooden Jewelry Box", description: "An elegantly handcrafted jewelry box.", image: "../static/images/handmade1.jpg", price: 50, category: "handmade", occasion: "birthday" },
            { name: "Embroidered Pillow Covers", description: "Add charm with these beautifully embroidered pillow covers.", image: "../static/images/handmade2.jpg", price: 30, category: "handmade", occasion: "anniversary" },
            { name: "Handwoven Baskets", description: "These handwoven baskets make perfect home decor.", image: "../static/images/handmade3.jpg", price: 35, category: "handmade", occasion: "holidays" },
            { name: "Macramé Wall Hanging", description: "A stunning macramé wall hanging to enhance your room.", image: "../static/images/handmade4.jpg", price: 60, category: "handmade", occasion: "wedding" },
            { name: "Handmade Pottery Mug Set", description: "A beautiful set of handcrafted pottery mugs.", image: "../static/images/handmade5.jpg", price: 40, category: "handmade", occasion: "graduation" },
            { name: "Gourmet Belgian Chocolate Box", description: "A premium Belgian chocolate gift box.", image: "../static/images/chocolate1.jpg", price: 45, category: "chocolate", occasion: "birthday" },
            { name: "Chocolate-Covered Strawberries", description: "Delicious strawberries covered in smooth chocolate.", image: "../static/images/chocolate2.jpg", price: 25, category: "chocolate", occasion: "holidays" },
            { name: "Hot Chocolate Gift Set", description: "Everything you need for a luxurious hot chocolate experience.", image: "../static/images/chocolate3.jpg", price: 35, category: "chocolate", occasion: "graduation" },
            { name: "Artisanal Truffle Selection", description: "A selection of rich, artisanal chocolate truffles.", image: "../static/images/chocolate4.jpg", price: 40, category: "chocolate", occasion: "anniversary" },
            { name: "Luxury Chocolate Gift Basket", description: "A luxury basket filled with the finest chocolates.", image: "../static/images/chocolate5.jpg", price: 60, category: "chocolate", occasion: "wedding" },
            { name: "Personalized Engraved Wooden Pen Set", description: "A beautiful wooden pen set with personalized engraving.", image: "../static/images/personalised1.jpg", price: 30, category: "personalized", occasion: "graduation" },
            { name: "Customizable Leather Wallet", description: "A sleek, customizable leather wallet.", image: "../static/images/personalised2.jpg", price: 45, category: "personalized", occasion: "birthday" },
            { name: "Personalized Engraved Wine Glasses", description: "A set of engraved wine glasses for special moments.", image: "../static/images/personalised3.jpg", price: 50, category: "personalized", occasion: "wedding" },
            { name: "Custom Embroidered Tote Bag", description: "A stylish tote bag with custom embroidery.", image: "../static/images/personalised4.jpg", price: 40, category: "personalized", occasion: "anniversary" },
            { name: "Customized Wooden Photo Frame", description: "A customized wooden photo frame for your favorite picture.", image: "../static/images/personalised5.jpg", price: 25, category: "personalized", occasion: "birthday" },
            { name: "Leather Strap Watch", description: "A classy leather strap watch for any occasion.", image: "../static/images/fashion1.jpg", price: 90, category: "fashion", occasion: "graduation" },
            { name: "Sleek Stainless Steel Necklace", description: "A sleek stainless steel necklace for fashion-forward individuals.", image: "../static/images/fashion2.jpg", price: 60, category: "fashion", occasion: "wedding" },
            { name: "Elegant Rose Gold Earrings", description: "Elegant rose gold earrings to enhance any outfit.", image: "../static/images/fashion3.jpg", price: 80, category: "fashion", occasion: "holidays" },
            { name: "Vintage Pocket Watch", description: "A vintage-inspired pocket watch.", image: "../static/images/fashion4.jpg", price: 70, category: "fashion", occasion: "birthday" },
            { name: "Silk Scarf Set", description: "A luxurious set of silk scarves in various patterns.", image: "../static/images/fashion5.jpg", price: 55, category: "fashion", occasion: "anniversary" }
        ];

            // Function to filter and display gifts
            function displayGifts(giftList) {
                categoryGiftList.innerHTML = '';
                giftList.forEach(gift => {
                    const giftCard = document.createElement('div');
                    giftCard.className = 'col-md-4 mb-4';
                    giftCard.innerHTML = `
                        <div class="card">
                            <img class="card-img-top" src="${gift.image}" alt="${gift.name}">
                            <div class="card-body">
                                <h5 class="card-title">${gift.name}</h5>
                                <p class="card-text">${gift.description}</p>
                                <p class="card-text"><strong>Price: $${gift.price}</strong></p>
                                <button class="btn btn-primary" onclick="addToCart({ name: '${gift.name}', price: ${gift.price}, quantity: 1 })">Add to Cart</button>
                            </div>
                        </div>
                    `;
                    categoryGiftList.appendChild(giftCard);
                });
            }

            // Determine the gifts to display based on the selected category or occasion
            if (selectedCategory) {
                categoryName.textContent = selectedCategory.charAt(0).toUpperCase() + selectedCategory.slice(1);
                const filteredGifts = gifts.filter(gift => gift.category === selectedCategory);
                displayGifts(filteredGifts);
            } else if (selectedOccasion) {
                categoryName.textContent = selectedOccasion.charAt(0).toUpperCase() + selectedOccasion.slice(1);
                const filteredGifts = gifts.filter(gift => gift.occasion === selectedOccasion);
                displayGifts(filteredGifts);
            } else {
                categoryName.textContent = "All Gifts";
                displayGifts(gifts);
            }
        });

        // Search functionality
        function searchGifts() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const giftCards = document.querySelectorAll('.card');
            giftCards.forEach(card => {
                const title = card.querySelector('.card-title').textContent.toLowerCase();
                if (title.includes(input)) {
                    card.parentElement.style.display = '';
                } else {
                    card.parentElement.style.display = 'none';
                }
            });
        }
        function logout() {
            // Optional: Clear session or local storage if needed
            // localStorage.removeItem('userSession');
            // sessionStorage.clear();
            // Redirect to the homepage or a specific logout page
            alert('Logging Out.........');
            window.location.href = '/';  // Redirect to home page after logout
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
